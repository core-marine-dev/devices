name: septentrio-sbf

on:
  workflow_dispatch:
  push:
    paths:
      - packages/septentrio-sbf/**
      # Its NMEA protocol composes the real upstream library, so a change there can
      # break this package with no job running.
      - packages/nmea-parser/**
      # This package BUNDLES the private @coremarine/protocol-core into its dist
      # (tsup noExternal), so a core change alters what it publishes and can break
      # its tests. The version gate keeps the extra trigger harmless: tests run,
      # publish no-ops unless the version changed.
      - packages/core/**
      # the shared protocols generator is a build input for this package
      - scripts/**

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      # Its tests import @coremarine/nmea-parser, which resolves to that package's
      # dist — absent in a fresh checkout, since dist is gitignored. Without this
      # step every test file fails to resolve before a single test runs.
      - name: 🏗️ Build dependencies
        run: "pnpm run protocol-core:build && pnpm run nmea-parser:build"

      - name: 🧑‍🔬 Tests
        run: "pnpm run septentrio-sbf:test"

      - name: 🛠️ Build
        run: "pnpm run septentrio-sbf:build"

  publish:
    name: 🚀 Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    # OIDC trusted publishing to npm (no NPM_TOKEN); provenance is emitted automatically.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v7

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: 🔎 Check published version
        id: check
        run: |
          NAME=$(node -p "require('./packages/septentrio-sbf/package.json').name")
          VERSION=$(node -p "require('./packages/septentrio-sbf/package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION not on npm — will publish"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Setup pnpm
        if: steps.check.outputs.publish == 'true'
        uses: pnpm/action-setup@v6

      - name: 📥 Install Dependencies
        if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build dependencies
        if: steps.check.outputs.publish == 'true'
        run: "pnpm run protocol-core:build && pnpm run nmea-parser:build"

      - name: 🛠️ Build
        if: steps.check.outputs.publish == 'true'
        run: "pnpm run septentrio-sbf:build"

      - name: 🚀 Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: "pnpm publish --access public --filter @coremarine/septentrio-sbf --no-git-checks"

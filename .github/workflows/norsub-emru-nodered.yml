name: norsub-emru-nodered

on:
  workflow_dispatch:
  push:
    paths:
      - packages/norsub-emru-nodered/**
      # Its tests run against the real upstream library.
      - packages/norsub-emru/**
      # These packages BUNDLE the private @coremarine/protocol-core into their dists
      # (tsup noExternal), so a core change alters what they publish and can break
      # their tests. The version gate keeps the extra trigger harmless: tests run,
      # publish no-ops unless the version changed.
      - packages/core/**

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      # The wrapper's tests import the real @coremarine/norsub-emru, which extends
      # @coremarine/nmea-parser, which bundles the private protocol-core — every dist in
      # that chain must exist first.
      - name: 🛠️ Build monorepo deps
        run: "pnpm run protocol-core:build && pnpm run nmea-parser:build && pnpm run norsub-emru:build"

      # node-red auto-loads the wrapper from its published entry (dist/parser.js), so the
      # integration test needs the wrapper built (JS + copied html/icons) before it runs.
      - name: 🛠️ Build wrapper
        run: "pnpm run norsub-emru:nodered:build"

      - name: 🧑‍🔬 Tests
        run: "pnpm run norsub-emru:nodered:test"

  publish:
    name: 🚀 Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    # OIDC trusted publishing to npm (no NPM_TOKEN); provenance is emitted automatically.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v7

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: 🔎 Check published version
        id: check
        run: |
          NAME=$(node -p "require('./packages/norsub-emru-nodered/package.json').name")
          VERSION=$(node -p "require('./packages/norsub-emru-nodered/package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION not on npm — will publish"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Setup pnpm
        if: steps.check.outputs.publish == 'true'
        uses: pnpm/action-setup@v6

      - name: 📥 Install Dependencies
        if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # `files` ships dist/, so it must be built before packing. The lib stays external
      # in the bundle, so the dep chain is not needed here (only the tests import it).
      - name: 🛠️ Build wrapper
        if: steps.check.outputs.publish == 'true'
        run: "pnpm run norsub-emru:nodered:build"

      - name: 🚀 Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: "pnpm publish --access public --filter @coremarine/norsub-emru-nodered --no-git-checks"

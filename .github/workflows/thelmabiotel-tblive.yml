name: thelmabiotel-tblive

on:
  workflow_dispatch:
  push:
    paths:
      - packages/thelmabiotel-tblive/**
      # This package bundles the private @coremarine/protocol-core into its dist
      # (tsup noExternal), so a core change alters what it publishes and can break
      # its tests. The version gate keeps the extra trigger harmless.
      - packages/core/**

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build monorepo deps
        run: "pnpm run protocol-core:build"

      # Runs with coverage so the thresholds in vitest.config.ts are actually
      # enforced — they are inert under a plain `vitest` run.
      - name: 🧑‍🔬 Tests
        run: "pnpm run thelmabiotel-tblive:test:coverage"

      - name: 🛠️ Build
        run: "pnpm run thelmabiotel-tblive:build"

  publish:
    name: 🚀 Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    # OIDC trusted publishing to npm (no NPM_TOKEN); provenance is emitted automatically.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v7

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: 🔎 Check published version
        id: check
        run: |
          NAME=$(node -p "require('./packages/thelmabiotel-tblive/package.json').name")
          VERSION=$(node -p "require('./packages/thelmabiotel-tblive/package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION not on npm — will publish"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Setup pnpm
        if: steps.check.outputs.publish == 'true'
        uses: pnpm/action-setup@v6

      - name: 📥 Install Dependencies
        if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build monorepo deps
        if: steps.check.outputs.publish == 'true'
        run: "pnpm run protocol-core:build"

      - name: 🛠️ Build
        if: steps.check.outputs.publish == 'true'
        run: "pnpm run thelmabiotel-tblive:build"

      - name: 🚀 Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: "pnpm publish --access public --filter @coremarine/thelmabiotel-tblive --no-git-checks"

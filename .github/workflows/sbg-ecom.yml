name: sbg-ecom

on:
  workflow_dispatch:
  push:
    paths:
      - packages/sbg-ecom/**
      # Since 1.0.0 this package COMPOSES nmea-parser: the device interleaves plain
      # NMEA with its binary frames on one wire, so the NMEA half is the real
      # upstream library and its tests run against it.
      - packages/nmea-parser/**
      # It BUNDLES the private @coremarine/protocol-core into its dist (tsup
      # noExternal), so a core change alters what it publishes and can break its
      # tests. The version gate keeps the extra trigger harmless: tests run,
      # publish no-ops unless the version changed.
      - packages/core/**
      # the shared protocols generator is a build input for nmea-parser
      - scripts/**

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      # ⚠️ THIS STEP DID NOT EXIST AND THE JOB COULD NEVER HAVE PASSED WITHOUT IT.
      # sbg-ecom now depends on nmea-parser, which depends on protocol-core, and both
      # `exports` point only at `dist/` — which is gitignored. On a fresh checkout
      # there is nothing to resolve, so every test file failed to import before a
      # single test ran. Verified by moving the dists aside and replaying these steps.
      - name: 🛠️ Build monorepo deps
        run: "pnpm run protocol-core:build && pnpm run nmea-parser:build"

      - name: 🧑‍🔬 Tests
        run: "pnpm run sbg-ecom:test"

      - name: 🛠️ Build
        run: "pnpm run sbg-ecom:build"

  publish:
    name: 🚀 Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    # OIDC trusted publishing to npm (no NPM_TOKEN); provenance is emitted automatically.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v7

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: 🔎 Check published version
        id: check
        run: |
          NAME=$(node -p "require('./packages/sbg-ecom/package.json').name")
          VERSION=$(node -p "require('./packages/sbg-ecom/package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION not on npm — will publish"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Setup pnpm
        if: steps.check.outputs.publish == 'true'
        uses: pnpm/action-setup@v6

      - name: 📥 Install Dependencies
        if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # The dep chain again: the published dist BUNDLES protocol-core, so publishing
      # without building it first would ship a broken tarball.
      - name: 🛠️ Build monorepo deps
        if: steps.check.outputs.publish == 'true'
        run: "pnpm run protocol-core:build && pnpm run nmea-parser:build"

      - name: 🛠️ Build
        if: steps.check.outputs.publish == 'true'
        run: "pnpm run sbg-ecom:build"

      - name: 🚀 Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: "pnpm publish --access public --filter @coremarine/sbg-ecom --no-git-checks"

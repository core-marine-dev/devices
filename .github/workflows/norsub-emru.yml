name: norsub-emru

on:
  workflow_dispatch:
  push:
    paths:
      - packages/norsub-emru/**

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🛠️ Build monorepo deps
        run: "pnpm run nmea-parser:build"

      - name: 🧑‍🔬 Tests
        run: "pnpm run norsub-emru:test"

      - name: 🛠️ Build
        run: "pnpm run norsub-emru:build"

  publish:
    name: 🚀 Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🛠️ Build monorepo deps
        run: "pnpm run nmea-parser:build"

      - name: 🛠️ Build
        run: "pnpm run norsub-emru:build"

      - name: 🚀 Publish to npm
        run: "pnpm publish --access public --filter @coremarine/norsub-emru --no-git-checks"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

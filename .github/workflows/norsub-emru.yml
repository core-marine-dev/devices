name: norsub-emru

on:
  workflow_dispatch:
  push:
    paths:
      - packages/norsub-emru/**
      # Its tests run against the real upstream library.
      - packages/nmea-parser/**
      # These packages BUNDLE the private @coremarine/protocol-core into their dists
      # (tsup noExternal), so a core change alters what they publish and can break
      # their tests. The version gate keeps the extra trigger harmless: tests run,
      # publish no-ops unless the version changed.
      - packages/core/**
      # the shared protocols generator is a build input for this package
      - scripts/**

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      # norsub-emru extends nmea-parser, which extends protocol-core — both
      # `exports` point only at `dist/`, so both must be built first.
      - name: 🛠️ Build monorepo deps
        run: "pnpm run protocol-core:build && pnpm run nmea-parser:build"

      - name: 🧑‍🔬 Tests
        run: "pnpm run norsub-emru:test"

      - name: 🛠️ Build
        run: "pnpm run norsub-emru:build"

  publish:
    name: 🚀 Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    # OIDC trusted publishing to npm (no NPM_TOKEN); provenance is emitted automatically.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v7

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: 🔎 Check published version
        id: check
        run: |
          NAME=$(node -p "require('./packages/norsub-emru/package.json').name")
          VERSION=$(node -p "require('./packages/norsub-emru/package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION not on npm — will publish"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Setup pnpm
        if: steps.check.outputs.publish == 'true'
        uses: pnpm/action-setup@v6

      - name: 📥 Install Dependencies
        if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # norsub-emru extends nmea-parser, which extends protocol-core — both
      # `exports` point only at `dist/`, so both must be built first.
      - name: 🛠️ Build monorepo deps
        if: steps.check.outputs.publish == 'true'
        run: "pnpm run protocol-core:build && pnpm run nmea-parser:build"

      - name: 🛠️ Build
        if: steps.check.outputs.publish == 'true'
        run: "pnpm run norsub-emru:build"

      - name: 🚀 Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: "pnpm publish --access public --filter @coremarine/norsub-emru --no-git-checks"

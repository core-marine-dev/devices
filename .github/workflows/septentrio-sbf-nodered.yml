name: septentrio-sbf-nodered

on:
  workflow_dispatch:
  push:
    paths:
      - packages/septentrio-sbf-nodered/**
      # The wrapper's tests run against the REAL library, which bundles the private
      # protocol-core — so a change to either can break this package with no job
      # running. The version gate keeps the extra triggers harmless: tests run,
      # publish no-ops unless the version changed.
      - packages/septentrio-sbf/**
      - packages/core/**

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      # The wrapper's tests import the real @coremarine/septentrio-sbf, which
      # bundles the private protocol-core — both dists must exist first.
      - name: 🛠️ Build monorepo deps
        run: "pnpm run protocol-core:build && pnpm run septentrio-sbf:build"

      # node-red auto-loads the wrapper from its published entry (dist/parser.js), so the
      # integration test needs the wrapper built (JS + copied html/icons) before it runs.
      - name: 🛠️ Build wrapper
        run: "pnpm run septentrio-sbf:nodered:build"

      - name: 🧑‍🔬 Tests
        run: "pnpm run septentrio-sbf:nodered:test"

  publish:
    name: 🚀 Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    # OIDC trusted publishing to npm (no NPM_TOKEN); provenance is emitted automatically.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v7

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: 🔎 Check published version
        id: check
        run: |
          NAME=$(node -p "require('./packages/septentrio-sbf-nodered/package.json').name")
          VERSION=$(node -p "require('./packages/septentrio-sbf-nodered/package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION not on npm — will publish"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Setup pnpm
        if: steps.check.outputs.publish == 'true'
        uses: pnpm/action-setup@v6

      - name: 📥 Install Dependencies
        if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # `files` ships dist/, so it must be built before packing. The library stays
      # external in the bundle, so the dep chain is not needed here — only the tests
      # import it.
      - name: 🛠️ Build wrapper
        if: steps.check.outputs.publish == 'true'
        run: "pnpm run septentrio-sbf:nodered:build"

      - name: 🚀 Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: "pnpm publish --access public --filter @coremarine/septentrio-sbf-nodered --no-git-checks"

name: TODO:-nodered

on:
  workflow_dispatch:
  push:
    paths:
      - packages/TODO:-nodered/**

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      # The wrapper's tests import the real wrapped library, so its dist must exist first.
      # TODO: build the wrapped library (and any private deps it bundles), e.g.:
      #   pnpm run protocol-core:build && pnpm run TODO::build
      - name: 🛠️ Build monorepo deps
        run: "pnpm run TODO::build"

      # node-red auto-loads the wrapper from dist/parser.js — build it before the integration test.
      - name: 🛠️ Build wrapper
        run: "pnpm run TODO::nodered:build"

      - name: 🧑‍🔬 Tests
        run: "pnpm run TODO::nodered:test"

  publish:
    name: 🚀 Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    # OIDC trusted publishing to npm (no NPM_TOKEN); provenance is emitted automatically.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v7

      - name: ❇️ Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: 🔎 Check published version
        id: check
        run: |
          NAME=$(node -p "require('./packages/TODO:-nodered/package.json').name")
          VERSION=$(node -p "require('./packages/TODO:-nodered/package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION not on npm — will publish"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Setup pnpm
        if: steps.check.outputs.publish == 'true'
        uses: pnpm/action-setup@v6

      - name: 📥 Install Dependencies
        if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: 🛠️ Build wrapper
        if: steps.check.outputs.publish == 'true'
        run: "pnpm run TODO::nodered:build"

      - name: 🚀 Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: "pnpm publish --access public --filter @coremarine/TODO:-nodered --no-git-checks"

packages:
  - 'packages/*'

# Supply-chain hardening — DENY all dependency build/lifecycle scripts.
# strictDepBuilds makes a NEW, unreviewed build-script dependency FAIL the
# install (ERR_PNPM_IGNORED_BUILDS) so it can never run silently. Each
# package below is reviewed and explicitly allowed or denied. To allow one,
# set it to true DELIBERATELY (and only after reviewing what its build
# script does).
strictDepBuilds: true
allowBuilds:
  # esbuild: tsup's bundler — its postinstall installs the platform-specific
  # binary. Trusted, dev-only, needed for all library builds.
  esbuild: true
patchedDependencies:
  tsup@8.5.1: patches/tsup@8.5.1.patch

# Security overrides — force patched versions of transitive deps that carry
# CVEs but can't be bumped directly (they're subdeps of node-red,
# node-red-node-test-helper, tsup). These are all dev-only.
#
# `serialize-javascript` was dropped with mocha on 2026-08-01: `pnpm why` showed
# mocha was its ONLY route into the tree, so the override had nothing left to
# override. `diff` stays — mocha was one source, but node-red-node-test-helper
# still reaches it through sinon.
#
# ⚠️ `js-yaml: '>=4.1.1'` was here and was ACTIVELY HARMFUL, so think twice before
# adding an override for a package a published package also declares. nmea-parser
# pinned js-yaml at an exact `4.2.0`; this override silently resolved the local
# install to 4.3.0, so the repo tested against a patched version while every
# CONSUMER of @coremarine/nmea-parser got 4.2.0 — which is vulnerable to
# GHSA-52cp-r559-cp3m (HIGH, fixed in 4.3.0). An override cannot protect a
# consumer; only the dependency range in the published package.json can.
# js-yaml is now `^5.2.3` in nmea-parser itself, so the override is unnecessary.
overrides:
  diff: '9.0.0'
  jsonata: '2.2.2'
  form-data: '4.0.6'
  esbuild: '0.28.2'
  # Added 2026-08-01 from `pnpm audit`. All four are dev-only transitives and none is
  # reachable from a published package (the tarballs ship `dist/` only), but they are
  # cheap to close: fast-uri <- ajv <- node-red · postcss <- tsup + vitest ·
  # brace-expansion <- minimatch <- eslint/typescript-eslint · body-parser <- express
  # <- node-red. Bumping node-red 5.0.1 -> 5.0.4 already cleared ten axios advisories
  # and one in tar, so check whether a direct bump fixes it before adding an override.
  fast-uri: '4.2.1'
  postcss: '8.5.28'
  brace-expansion: '5.0.12'
  body-parser: '1.20.8'
  # Added 2026-10-09 from `pnpm audit` (36 advisories, ALL dev-only: every path runs
  # through node-red, eslint or vite — none reaches a published tarball). Each is the
  # newest same-major release that fixes its advisory AND clears the 7-day cooldown.
  # node-red 5.0.8 may clear several directly but is itself inside the cooldown; retry
  # the direct bump first next time. http-cache-semantics (HIGH, <- got <- node-red) is
  # NOT here on purpose: its only fix, 4.3.0, is 5 days old — it clears 2026-10-11.
  axios: '1.20.0'
  ip-address: '10.7.3'
  moment: '2.31.0'
  multer: '2.4.0'
  nanoid: '3.3.19'
  proxy-addr: '2.0.8'
  qs: '6.16.0'
  source-map-js: '1.2.2'

# Supply-chain hardening — a 7-day release cooldown (cru, 2026-10-09). pnpm refuses
# any version published less than 10080 minutes ago, so a compromised release has a
# week to be caught and unpublished before it can reach this repo. Pair it with EXACT
# versions everywhere (no ^ ~ >= ranges, internal links as workspace:*): see
# docs/TOOLING.md §"Exact pins". To take an urgent fix sooner, add that one
# name@version to minimumReleaseAgeExclude — deliberately, with a reason.
minimumReleaseAge: 10080
# Our own packages are exempt (cru, 2026-10-09): we publish them ourselves through OIDC
# trusted publishing with provenance, so the cooldown guards against nothing for them —
# it only delays our own fixes (sbg-ecom 1.0.1 fixed a broken 1.0.0; a 7-day wait would
# have kept consumers on the broken release). Consumers of @coremarine/* (Tracker) should
# carry the same line.
minimumReleaseAgeExclude:
  - '@coremarine/*'
  # cru's own SchemasJS releases of 2026-10-10, taken early on his word: they fix the
  # published .d.ts that failed `skipLibCheck: false` for every consumer (TS2307 'zod',
  # TS2314 BaseSchema). Exact versions only — the scope is NOT exempt, because these
  # releases carry no npm provenance. Remove once older than 7 days (2026-10-17).
  - '@schemasjs/validator@2.0.7'
  - '@schemasjs/valibot-numbers@1.1.3'

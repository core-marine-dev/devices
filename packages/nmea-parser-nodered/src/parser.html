<!-- Help text -->
<script type="text/markdown" data-help-name="cma-nmea-parser">
Parser of NMEA 0183 protocol sentences [check @coremarine/nmea-parser package docs](https://www.npmjs.com/package/@coremarine/nmea-parser)

### Input

: payload (string) : NMEA ASCII content (important, it is an *ASCII* string, not other encoding).

: *memory* (object): Object to check or enabled / disabled parser memory state (look details below).

: *sentences* (object) : Object to get or set the sentence definitions the parser knows (look details below).

: *definition* (string): Sentence ID, to read every stored definition of it (look details below).

: *fake* (string): Sentence ID to get, if it is supported, a fake nmea sentence (look details below).

### Output

: payload (array) : The parsing output of the CoreMarine NMEA Parser — an array of **CMA** objects (the unified CoreMarine output format), one per NMEA sentence.

: *memory* (object) : Response to the *memory* input (look details below).

: *sentences* (object) : Response to the *sentences* input (look details below).

: *definition* (array): Response to the *definition* input (look details below).

: *fake* (string): Response to the *fake* input (look details below).

### Details

NMEA parser translate NMEA ASCII string data into a JavaScript objects (one for each
NMEA 0183 sentence). Each time it receives data from payload input, it gives the parsed sentences to payload output.

It just a wrapper of the npm library [@coremarine/nmea-parser](https://www.npmjs.com/package/@coremarine/nmea-parser) (take a look on it).

To interact with the *memory* | *sentences* | *definition* API is through the `memory` | `sentences` | `definition` property:

- If you request something in `msg.memory` | `msg.sentences` | `msg.definition` input
- The response will be in `msg.memory` | `msg.sentences` | `msg.definition` output

#### Memory

It is enabled by default:

- memory enabled: Every time you inject data, it's attached to the internal data.
- memory disabled: Every time you inject data, it clears internal data and add new one.

Internally it has a buffer with a max number of characters

|                          Input                           |                            Output                             |
| :------------------------------------------------------: | :-----------------------------------------------------------: |
| `memory`: { `command`: `"set"`, `payload`: **boolean** } | `memory`: { `memory`: **boolean**, `characters`: **number** } |
|             `memory`: { `command`: `"get"` }             | `memory`: { `memory`: **boolean**, `characters`: **number** } |

#### Sentences

The parser can be fed or expanded to understand more NMEA sentences, standard or proprietary.
To do that, send an object with `command` equal to `"set"` and **one** of:

1. `content`: the YAML **string** of the sentence definitions.
2. `file`: a **string** file path to the sentences YAML file (read by the node).

If both are sent, `content` takes precedence over `file`. On error (bad YAML/schema or unreadable file) the `sentences` output is an error **string**.

If you just want to know the known / supported sentences, use the command `get`. Either way the
response is the known definitions **grouped by protocol name**.

|                           Input                            |         Output          |
| :--------------------------------------------------------: | :---------------------: |
| `sentences`: { `command`: `"set"`, `content`: **string** } | `sentences`: **object** |
|  `sentences`: { `command`: `"set"`, `file`: **string** }   | `sentences`: **object** |
|            `sentences`: { `command`: `"get"` }             | `sentences`: **object** |

#### Definition

If you want to know what the parser knows about a sentence, send the sentence id. The response is an
**array** — one entry per version of that id, because the knowledge base holds a definition per
revision of the standard and several sentences changed between them.

An unknown or malformed id answers with an **error string** saying why, not `null`.

|          Input           |                  Output                  |
| :----------------------: | :--------------------------------------: |
| `definition`: **string** | `definition`: **array** \| **string** (error) |

#### Fake

If you want to get a NMEA-like sentence, maybe just to do some tests, you need to send the sentence id.
Response will be a `string` with the whole ASCII sentence, or an **error string** if the id is unknown.
This fake sentence is valid NMEA — correct framing and checksum — but the field values are filler.

The same id always produces the same sentence, so it is safe to use as a fixture.

|       Input        |                Output                |
| :----------------: | :----------------------------------: |
| `fake`: **string** | `fake`: **string** (sentence or error) |

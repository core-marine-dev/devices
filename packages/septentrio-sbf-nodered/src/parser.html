<!-- Help text -->
<script type="text/markdown" data-help-name="cma-septentrio-parser">
Parser for **Septentrio** GNSS receivers speaking **SBF** (Septentrio Binary Format),
emitting the unified **CMA** format. Wrapper of
[@coremarine/septentrio-sbf](https://www.npmjs.com/package/@coremarine/septentrio-sbf).

**All 108 blocks** of the AsteRx SB3 Pro+ firmware 4.10.1 reference guide are decoded.

### Input

: payload (buffer|string) : The data to parse, and a string means different things per
  protocol: on **nmea** it is the sentence itself (`$PSSN,HRP,…`), on **sbf** it must be
  base64, because SBF is binary and has no text form. A **Buffer** — what the serial, TCP
  and file nodes give you — and an array of byte numbers work on both (details below).

: *memory* (object) : Check or enable / disable the parser's memory (details below).

: *protocol* (object) : Get or set the device protocol (details below).

: *firmware* (object) : Get or pin the knowledge base, and read what the receiver reports.

: *ids* (any) : Any truthy value, to list every block number this parser knows.

: *definition* (number | string | object) : A block number, or `{ id, protocol? }`, to read
  its field definitions per revision.

: *fake* (number | object) : A block number, or `{ id, protocol?, options? }`, to generate a
  real wire frame for testing.

### Output

: payload (array) : An array of **CMA** objects, one per parsed block.

: *memory* (object) : Response to the *memory* input.

: *protocol* (object) : Response to the *protocol* input.

: *firmware* (object) : Response to the *firmware* input.

: *ids* (array) : Response to the *ids* input.

: *definition* (array | string) : Response to the *definition* input.

: *fake* (buffer | string) : Response to the *fake* input.

Any input key you do not send is absent from the output too. On a bad request the
corresponding output key holds an error **string** instead of a result.

### Details

#### `id` is the block NUMBER

Each CMA's `id` is the SBF block number as a string — `"5938"`, not `"AttEuler"`. The
human name is in `metadata.name`. The number is what the wire carries and what
Septentrio's own documentation indexes by.

#### Values are the datasheet's, unscaled

A field documented in units of `0.01 m` keeps `value: 812` with `units: "0.01 m"`, and the
engineering value is in that field's `metadata` as `{ value: 8.12, units: "m" }`. Angles in
radians or semi-circles work the same way, with the degrees in `metadata`. The datasheet
stays the single source of truth and nothing guesses what scale you wanted.

Bitfields, masks and enums keep their integer `value`; the decoded meaning is in that
field's `metadata`.

#### The timestamp is the RECEIVER's clock

`msg.payload[i].timestamp` is the block's own GNSS time, not this machine's — every SBF
block carries a GPS time stamp and a GNSS receiver's clock is disciplined to atomic time.
Leap seconds are learned from the device itself (`ReceiverTime.DeltaLS`).

Two exceptions: the raw navigation pages and decoded navigation messages are stamped with
when the **satellite transmitted** the bits, which can be far in the past, so those keep
the parse time; and a block whose GPS time is Do-Not-Use (normal for a few seconds after
start-up) has no device time to promote.

`metadata.timestamp` always carries `received` and `parsed` if you need the host-side
timings.

#### Nothing is dropped silently

Every byte either decodes, comes out reported, or waits on the buffer as the
still-incomplete tail. The signal is the optional **`errors`** array on each CMA:

- A **bad CRC or a truncated body** does not stop the decode — the fields come back
  anyway, plus `errors` saying what is wrong. Flagged data is more useful than none.
- Bytes that cannot start a block come back as a **garbage sentence**: a valid CMA whose
  `id` and `protocol` are `"unknown"` with an empty `payload`, keeping `raw` so you can
  see what was discarded. Adjacent junk is coalesced into one report, so a noisy line does
  not flood the flow.
- A block number this build does **not** know still produces a sentence — real `id`, real
  timestamp, body in `metadata.body`, empty `payload`, `metadata.name: "unknown"` — and
  **no `errors`**, because nothing is wrong. That is what keeps a newer firmware's blocks
  from vanishing.

⚠️ **Two things a flow must handle:**

- A field value can be **`null`**, meaning the receiver marked it Do-Not-Use. Its
  `metadata` then says `{ doNotUse: true, value: <the sentinel> }`. **`null` means "not
  available" and must never be read as zero** — a Do-Not-Use course-over-ground is not a
  heading of north.
- Check `errors` and `id === "unknown"` before trusting a reading.

#### Sub-blocks

Many blocks repeat a nested record N times (per antenna, per channel, per satellite). Those
fields are flattened into `payload` in wire order, and mirrored grouped-by-occurrence at
`metadata.subBlocks`, so you can read occurrence *i* without offset arithmetic.

#### Memory

Enabled by default, and you want it on for a live stream:

- memory enabled: each message is appended to whatever is still buffered.
- memory disabled: each message replaces the buffer.

`bytes` in the report is the buffer limit and `pending` is how much is currently held. The
limit defaults to **65535** — the largest a single SBF block can be — because a block only
decodes once its last byte arrives. Real blocks run past 1000 bytes, so a smaller limit
would discard good data.

|                          Input                           |                                     Output                                      |
| :------------------------------------------------------: | :-----------------------------------------------------------------------------: |
| `memory`: { `command`: `"set"`, `payload`: **boolean** } | `memory`: { `memory`: **boolean**, `bytes`: **number**, `pending`: **number** } |
|             `memory`: { `command`: `"get"` }             | `memory`: { `memory`: **boolean**, `bytes`: **number**, `pending`: **number** } |

#### Protocol

The **device** protocol. A Septentrio receiver can be configured to emit SBF, NMEA or RTCM
on the same port, so the device is not the same thing as the protocol. Only `sbf` exists
today; the channel is here because NMEA is a planned addition, so a flow written against
it keeps working.

Switching **discards the buffer** and any undrained sentences: the pending bytes were being
read under different framing rules.

|                           Input                           |                              Output                               |
| :-------------------------------------------------------: | :---------------------------------------------------------------: |
| `protocol`: { `command`: `"set"`, `payload`: **string** } | `protocol`: { `protocol`: **string**, `protocols`: **string[]** } |
|            `protocol`: { `command`: `"get"` }             | `protocol`: { `protocol`: **string**, `protocols`: **string[]** } |

#### Firmware

Which knowledge base describes each block. The receiver is normally the authority on
itself: `ReceiverSetup` (5902) reports its real version and the parser adopts it. A version
this build does not model is **reported, never substituted** — the report's `reported` key
is what the box said, and that block carries an `errors` entry saying which table was used
instead.

`leapSeconds` in the report is the GPS-UTC offset learned from `ReceiverTime.DeltaLS`;
absent until such a block arrives, in which case a built-in table is used.

|                           Input                           |                                Output                                 |
| :-------------------------------------------------------: | :-------------------------------------------------------------------: |
| `firmware`: { `command`: `"set"`, `payload`: **string** } | `firmware`: { `firmware`, `firmwares`, `reported`?, `leapSeconds`? } |
|            `firmware`: { `command`: `"get"` }             | `firmware`: { `firmware`, `firmwares`, `reported`?, `leapSeconds`? } |

#### Ids

Send any truthy value to list every block number this parser knows — 108 of them for
firmware 4.10.1. The discovery counterpart to *definition*.

|      Input      |       Output        |
| :-------------: | :-----------------: |
| `ids`: **true** | `ids`: **string[]** |

#### Definition

What the parser believes a block looks like: its field definitions with types, units,
Do-Not-Use values and descriptions — **one entry per revision**. The per-revision split is
the point: a receiver generation only sends the fields its revision defines, so seeing them
side by side tells you what a given box will actually give you.

Seven blocks are `opaque` — the five `Meas3*` and the two `PVTSupport*` — because
Septentrio publishes no field layout for them at all. Their bodies are emitted as bytes
rather than invented into fields.

This is a **diagnostic** tool. A receiver on a remote installation with restricted internet
stays there for years, and being able to ask the running node what it expects settles a
question that would otherwise need the datasheets.

|                             Input                             |                Output                 |
| :-----------------------------------------------------------: | :-----------------------------------: |
|                   `definition`: **number**                    | `definition`: **array** \| **string** |
| `definition`: { `id`: **number**, `protocol`: **string** } | `definition`: **array** \| **string** |

#### Fake

Generate a real wire frame for testing — built from the same field table the parser reads,
with a real CRC and a real `Length`, so wiring `fake` straight back into `payload`
round-trips. It comes back as a **Buffer**.

**Deterministic**: the same request returns the same bytes forever, which is what makes it
usable in a committed flow. `options` takes `{ revision?, tow?, wnc?, fields?, random? }` —
`fields` overrides individual fields by name, and `random: true` fills the rest with
varied (still reproducible) values instead of zeros.

|                                  Input                                   |       Output       |
| :----------------------------------------------------------------------: | :----------------: |
|                          `fake`: **number**                              | `fake`: **buffer** |
| `fake`: { `id`: **number**, `options`: { `revision`, `fields`, … } } | `fake`: **buffer** |

#### Input — a string means different things per protocol

On **nmea**, `payload` is the **sentence as a string**: NMEA 0183 is an ASCII text protocol,
so that is its natural form and it is what the example flow uses.

    msg.payload = '$PSSN,HRP,104751.00,230324,23.455,1.954,0.0125,0.123,0.0234,0.03765,11,0,4.56453,W*20\r\n'

On **sbf**, `payload` is normally a **Buffer** and needs no conversion from the serial, TCP
or file nodes. A string there must be **base64** — every `raw` in the CMA output is base64,
so it is this package's own vocabulary for bytes, and it closes the diagnostic loop: copy a
`raw` out of a debug node, inject it back, and you are re-parsing the exact frame that
misbehaved. Base64 is validated strictly, so an ASCII string is rejected with a message
rather than parsed as garbage.

A **Buffer** or an **array of byte numbers** works on BOTH protocols. That is not an
afterthought: a serial port emits bytes whichever protocol the receiver is configured for,
so a byte-fed flow keeps working when you switch the protocol mid-flow.

### Upgrading from 1.x

The output is now **CMA** rather than `SBFResponse`, and the msg API is entirely different.
1.x drove the node with a single `msg.command` string; there is now one msg key per
channel, so a message can reconfigure and feed data at once.

| 1.x | 2.0.0 |
| --- | --- |
| `command: "addData"` + `payload` buffer, then `command: "getData"` | just send `payload` — the parsed CMA array comes back on `payload` |
| `command: "getFirmware"` / `"setFirmware"` | `firmware`: { `command`: `"get"` \| `"set"`, `payload`? } |
| `command: "getMemory"` / `"setMemory"` | `memory`: { `command`: `"get"` \| `"set"`, `payload`? } |
| — | `protocol`, `ids`, `definition`, `fake` are new |
| output `SBFResponse` with `frame.header` / `frame.time` / `frame.body` | **CMA**: `payload` is the SBF body, header and time in `metadata` |
| a bad CRC, wrong length or unknown block was **dropped silently** | every one of them is reported — see *Nothing is dropped silently* |

The node type is unchanged (`cma-septentrio-parser`), so deployed flows keep their node —
but the messages in and out of it must be rewritten.

</script>

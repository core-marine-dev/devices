protocols:
  # =================================================================
  # NMEA 0183 — Standard sentences
  # =================================================================
  - protocol: NMEA
    version: '3.1'
    standard: true
    sentences:
      - id: AAM
        description: Waypoint Arrival Alarm
        payload:
          # 1
          - name: status
            type: string
            description: "BOOLEAN\n

              A = arrival circle entered\n

              V = arrival circle not passed"
          # 2
          - name: status
            type: string
            description: "BOOLEAN\n

              A = perpendicular passed at waypoint\n

              V = perpendicular not passed"
          # 3
          - name: arrival_circle_radius
            type: float32
          # 4
          - name: radius_units
            type: string
            units: nautical miles
          # 5
          - name: waypoint_id
            type: string
      - id: DTM
        description: "The DTM message identifies the local geodetic datum and datum offsets from a reference datum. This sentence is used to define the datum to which a position location, and geographic locations in subsequent sentences, is referenced."
        payload:
          # 1
          - name: local_datum_code
            type: string
            description: "Local datum code (CCC):\n
              W84 - WGS-84\n
              W72 - WGS-72\n
              S85 - SGS85\n
              P90 - PE90\n
              999 - User-defined\n
              IHO datum code"
          # 2
          - name: local_datum_subdivision_code
            type: string
            description: "Local datum subdivision code (x)"
          # 3
          - name: latitude_offset
            type: float32
            units: minutes
            description: Latitude offset, in minutes (x.x)
          # 4
          - name: latitude_direction
            type: string
            description: N/S (x)
          # 5
          - name: longitude_offset
            type: float32
            units: minutes
            description: "Longitude offset, in minutes (x.x)"
          # 6
          - name: longitude_direction
            type: string
            description: E/W (x)
          # 7
          - name: altitude_offset
            type: float32
            units: meters
            description: "Altitude offset, in meters (x.x)"
          # 8
          - name: datum_code
            type: string
            description: "Reference datum code (CCC):\n
              W84 - WGS-84\n
              W72 - WGS-72\n
              S85 - SGS85\n
              P90 - PE90"
      - id: GGA
        description: Global Positioning System Fix Data
        payload:
          # 1
          - name: utc_position
            type: string
            units: ms
          # 2
          - name: latitude
            type: string
            units: deg
          # 3
          - name: latitude_direction
            type: string
            description: "N: North\n
              S: South"
          # 4
          - name: longitude
            type: string
            units: deg
          # 5
          - name: longitude_direction
            type: string
            description: "E - East\n
              W - West"
          # 6
          - name: gps_quality
            type: int8
            description: "0: Fix not valid\n
              1: GPS fix\n
              2: Differential GPS fix (DGNSS), SBAS, OmniSTAR VBS, Beacon, RTX in GBAS mode\n
              3: Not applicable\n
              4: RTK Fixed, xFill\n
              5: RTK Float, OmniSTAR XP/HP, Location RTK, RTX\n
              6: INS Dead reckoning\n
              7: Manual Input Mode\n
              8: Simulator Mode"
          # 7
          - name: satellites
            type: uint8
          # 8
          - name: hdop
            type: float64
          # 9
          - name: altitude
            type: float64
            units: m
            description: "Orthometric height Mean-Sea-Level (MSL reference)"
          # 10
          - name: altitude_units
            type: string
            units: m
          # 11
          - name: geoid_separation
            type: float64
            units: m
            description: "Geoidal Separation: the difference between the WGS-84 earth ellipsoid surface and mean-sea-level (geoid) surface, \"-\" = mean-sea-level surface below WGS-84 ellipsoid surface."
          # 12
          - name: geoid_separation_units
            type: string
            units: m
          # 13
          - name: age_of_differential_gps_data
            type: uint32
            units: sec
            description: "Time in seconds since last SC104 Type 1 or 9 update, null field when DGPS is not used"
          # 14
          - name: reference_station_id
            type: uint16
            description: "Reference station ID, range 0000 to 4095. A null field when any reference station ID is selected and no corrections are received. See table below for a description of the field values.\n

              0002 CenterPoint or ViewPoint RTX\n

              0005 RangePoint RTX\n

              0006 FieldPoint RTX\n

              0100 VBS\n

              1000 HP\n

              1001 HP/XP (Orbits)\n

              1002 HP/G2 (Orbits)\n

              1008 XP (GPS)\n

              1012 G2 (GPS)\n

              1013 G2 (GPS/GLONASS)\n

              1014 G2 (GLONASS)\n

              1016 HP/XP (GPS)\n

              1020 HP/G2 (GPS)\n

              1021 HP/G2 (GPS/GLONASS)"
      - id: GSA
        description: "GPS DOP and active satellites"
        payload:
          # 1
          - name: mode
            type: string
            description: "Mode 1:\n
              M = Manual\n
              A = Automatic"
          # 2
          - name: fix
            type: uint8
            description: "Mode 2: Fix type:\n
              1 = not available\n
              2 = 2D\n
              3 = 3D"
          # 3
          - name: satellite_id_1
            type: uint8
            description: "PRN number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS\n
              64+ for GLONASS"
          # 4
          - name: satellite_id_2
            type: uint8
            description: "PRN number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS\n
              64+ for GLONASS"
          # 5
          - name: satellite_id_3
            type: uint8
            description: "PRN number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS\n
              64+ for GLONASS"
          # 6
          - name: satellite_id_4
            type: uint8
            description: "PRN number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS\n
              64+ for GLONASS"
          # 7
          - name: satellite_id_5
            type: uint8
            description: "PRN number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS\n
              64+ for GLONASS"
          # 8
          - name: satellite_id_6
            type: uint8
            description: "PRN number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS\n
              64+ for GLONASS"
          # 9
          - name: satellite_id_7
            type: uint8
            description: "PRN number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS\n
              64+ for GLONASS"
          # 10
          - name: satellite_id_8
            type: uint8
            description: "PRN number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS\n
              64+ for GLONASS"
          # 11
          - name: satellite_id_9
            type: uint8
            description: "PRN number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS\n
              64+ for GLONASS"
          # 12
          - name: satellite_id_10
            type: uint8
            description: "PRN number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS\n
              64+ for GLONASS"
          # 13
          - name: satellite_id_11
            type: uint8
            description: "PRN number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS\n
              64+ for GLONASS"
          # 14
          - name: satellite_id_12
            type: uint8
            description: "PRN number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS\n
              64+ for GLONASS"
          # 15
          - name: pdop
            type: float32
            description: "PDOP: 0.5 to 99.9"
          # 16
          - name: hdop
            type: float32
            description: "HDOP: 0.5 to 99.9"
          # 17
          - name: vdop
            type: float32
            description: "VDOP: 0.5 to 99.9"
          # 18
          # - name: system_id
          #   type: uint8
          #   description: "System ID based on:\n
          #     1 GPS\n
          #     2 GLONASS\n
          #     3 Galileo\n
          #     4 BeiDou\n
          #     0 QZSS"
      - id: GST
        description: "Position error statistics"
        payload:
          # 1
          - name: utc_position_fix
            type: string
            units: "hhmmss.ss"
            description: "UTC time of associated GGA fix"
          # 2
          - name: total_rms
            type: float64
            description: "RMS value of the pseudorange residuals; includes carrier phase residuals during periods of RTK (float) and RTK (fixed) processing"
          # 3
          - name: semi_major_standard_deviation
            type: float64
            units: meters
            description: "Standard deviation (meters) of semi-major axis of error ellipse"
          # 4
          - name: semi_minor_standard_deviation
            type: float64
            units: meters
            description: "Standard deviation (meters) of semi-minor axis of error ellipse"
          # 5
          - name: ellipse_orientation
            type: float64
            units: true north degrees
            description: "Orientation of semi-major axis of error ellipse (true north degrees)"
          # 6
          - name: latitude_standard_deviation
            type: float64
            units: meters
            description: "Standard deviation (meters) of latitude error"
          # 7
          - name: longitude_standard_deviation
            type: float64
            units: meters
            description: "Standard deviation (meters) of longitude error"
          # 8
          - name: altitude_standard_deviation
            type: float64
            units: meters
            description: "Standard deviation (meters) of altitude error"
      - id: GSV
        description: "GNSS Satellites in View"
        payload:
          # 1
          - name: total_messages
            type: uint8
            description: "Total number of GSV messages in this cycle (1 to 9)"
          # 2
          - name: message_number
            type: uint8
            description: "Current message number (1 to 9)"
          # 3
          - name: satellites_in_view
            type: uint16
            description: "Total number of satellites in view"
          # 4 — Satellite block 1
          - name: satellite_id_1
            type: uint8
            description: "Satellite PRN/ID number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS (add 87 to get actual SBAS PRN)\n
              65 to 96 for GLONASS (subtract 64 to get GLONASS slot number)"
          # 5
          - name: elevation_1
            type: int8
            units: deg
            description: "Satellite elevation, -90 to 90 degrees"
          # 6
          - name: azimuth_1
            type: uint16
            units: deg
            description: "Satellite azimuth from true north, 000 to 359 degrees"
          # 7
          - name: snr_1
            type: uint8
            units: dB-Hz
            description: "Signal-to-noise ratio (C/No), 00 to 99 dB-Hz (null when not tracking)"
          # 8 — Satellite block 2
          - name: satellite_id_2
            type: uint8
            description: "Satellite PRN/ID number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS (add 87 to get actual SBAS PRN)\n
              65 to 96 for GLONASS (subtract 64 to get GLONASS slot number)"
          # 9
          - name: elevation_2
            type: int8
            units: deg
            description: "Satellite elevation, -90 to 90 degrees"
          # 10
          - name: azimuth_2
            type: uint16
            units: deg
            description: "Satellite azimuth from true north, 000 to 359 degrees"
          # 11
          - name: snr_2
            type: uint8
            units: dB-Hz
            description: "Signal-to-noise ratio (C/No), 00 to 99 dB-Hz (null when not tracking)"
          # 12 — Satellite block 3
          - name: satellite_id_3
            type: uint8
            description: "Satellite PRN/ID number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS (add 87 to get actual SBAS PRN)\n
              65 to 96 for GLONASS (subtract 64 to get GLONASS slot number)"
          # 13
          - name: elevation_3
            type: int8
            units: deg
            description: "Satellite elevation, -90 to 90 degrees"
          # 14
          - name: azimuth_3
            type: uint16
            units: deg
            description: "Satellite azimuth from true north, 000 to 359 degrees"
          # 15
          - name: snr_3
            type: uint8
            units: dB-Hz
            description: "Signal-to-noise ratio (C/No), 00 to 99 dB-Hz (null when not tracking)"
          # 16 — Satellite block 4
          - name: satellite_id_4
            type: uint8
            description: "Satellite PRN/ID number:\n
              01 to 32 for GPS\n
              33 to 64 for SBAS (add 87 to get actual SBAS PRN)\n
              65 to 96 for GLONASS (subtract 64 to get GLONASS slot number)"
          # 17
          - name: elevation_4
            type: int8
            units: deg
            description: "Satellite elevation, -90 to 90 degrees"
          # 18
          - name: azimuth_4
            type: uint16
            units: deg
            description: "Satellite azimuth from true north, 000 to 359 degrees"
          # 19
          - name: snr_4
            type: uint8
            units: dB-Hz
            description: "Signal-to-noise ratio (C/No), 00 to 99 dB-Hz (null when not tracking)"
          # 20 (NMEA 4.10+)
          # - name: signal_id
          #   type: uint8
          #   description: "NMEA 4.10+ Signal ID (hex). Values depend on talker ID / constellation:\n
          #     0 = All signals (any constellation)\n
          #     GP (GPS/SBAS): 1 = L1C/A, 6 = L2C-L\n
          #     GA (Galileo): 7 = L1-BC, 2 = E5b\n
          #     GB (BeiDou): B = B2I\n
          #     GL (GLONASS): 3 = G2 C/A"
      - id: HDT
        description: Heading - True
        payload:
          # 1
          - name: heading
            type: float32
            description: "Heading, degrees True"
          # 2
          - name: "true"
            type: string
            description: "T = True"
      - id: MWV
        description: Wind Speed and Angle
        payload:
          # 1
          - name: wind_angle
            type: float32
            units: deg
            description: "Wind angle, 0.0 to 359.9 degrees relative to the vessel's bow/centerline"
          # 2
          - name: reference
            type: string
            description: "Reference: R = Relative, T = True"
          # 3
          - name: wind_speed
            type: float32
            description: "Wind speed to the nearest tenth of a unit"
          # 4
          - name: wind_speed_units
            type: string
            description: "Wind speed units: K = km/h, M = m/s, N = knots, S = statute miles/h"
          # 5
          - name: status
            type: string
            description: "Data validity: A = Valid, V = Invalid"
      - id: THS
        description: "True Heading and Status"
        payload:
          # 1
          - name: heading
            type: float32
            units: deg
            description: "Heading in degrees True, 0.00 to 359.99"
          # 2
          - name: mode
            type: string
            description: "Mode indicator:\n
              A = Autonomous\n
              E = Estimated (dead reckoning)\n
              M = Manual input\n
              S = Simulator\n
              V = Data not valid"
      - id: VTG
        description: Track Made Good and Ground Speed
        payload:
          # 1
          - name: track_degrees_true
            type: float32
            units: deg
            description: "Track angle in degrees True"
          # 2
          - name: true_indicator
            type: string
            description: "T = True"
          # 3
          - name: track_degrees_magnetic
            type: float32
            units: deg
            description: "Track angle in degrees Magnetic"
          # 4
          - name: magnetic_indicator
            type: string
            description: "M = Magnetic"
          # 5
          - name: speed_knots
            type: float32
            units: knots
            description: "Speed over ground in knots"
          # 6
          - name: knots_indicator
            type: string
            description: "N = Knots"
          # 7
          - name: speed_kilometers_per_hour
            type: float32
            units: km/h
            description: "Speed over ground in kilometers per hour"
          # 8
          - name: kmh_indicator
            type: string
            description: "K = Kilometers per hour"
          # 9 (NMEA 2.3+)
          - name: mode_indicator
            type: string
            description: "Mode indicator (NMEA 2.3+)\n
              A = Autonomous\n
              D = Differential\n
              E = Estimated (dead reckoning)\n
              M = Manual input\n
              N = Data not valid"
      - id: ZDA
        description: Time & Date - UTC, day, month, year and local time zone
        payload:
          # 1
          - name: utc_time
            type: string
            description: "UTC time (hours, minutes, seconds, may have fractional subseconds)"
          # 2
          - name: day
            type: int8
            description: "Day, 01 to 31"
          # 3
          - name: month
            type: int8
            description: "Month, 01 to 12"
          # 4
          - name: year
            type: int16
            description: "Year (4 digits)"
          # 5
          - name: local_zone_hours
            type: int8
            description: "Local zone description, 00 to +- 13 hours"
          # 6
          - name: local_zone_minutes
            type: int8
            description: "Local zone minutes description, 00 to 59, apply same sign as local hours"
  # =================================================================
  # NMEA 0183 — Proprietary sentences: Miros SM-050 Wave and Current Radar
  # =================================================================
  - protocol: NMEA
    version: '3.1'
    standard: false
    sentences:
      # ---------------------------------------------------------------
      # PMIRWM – Wave Parameters (WM data block rev3)
      # Miros SM-050 Wave and Current Radar
      #
      # Fixed: 6 header fields + 43 value/status pairs = 92 CSV fields
      # Status codes: 0=not validated, 1=OK, 2=accepted w/comments,
      #               7=out of range, 8=not accepted, 9=undefined/invalid
      #
      # Params 1-14 confirmed from Miros SM-140 manual (same PMIRWM format).
      # Params 15-29 inferred from data values, marked (?) if uncertain.
      # Params 30-37 unknown, sample values annotated.
      # Params 38-43 reserved (always empty, status 9).
      # ---------------------------------------------------------------
      - id: PMIRWM
        description: "Miros wave parameters (WM data block rev3)"
        payload:
          # --- Header ---
          # 1
          - name: timestamp
            type: string
            description: "UTC timestamp hhmmss or hhmmss.sss"
          # 2
          - name: day
            type: uint8
            description: "Day of month, 01-31"
          # 3
          - name: month
            type: uint8
            description: "Month, 01-12"
          # 4
          - name: year
            type: uint16
            description: "Year"
          # 5
          - name: sequence_number
            type: string
            description: "Sequence number (max 8 chars)"
          # --- Wave parameters: 43 value/status pairs ---
          # 6-7 — confirmed
          - name: SDp1
            type: float32
            units: m²/Hz
            description: "Primary wave spectral density"
          - name: SDp1_status
            type: uint8
            description: "Status code (0-9)"
          # 8-9 — confirmed
          - name: Hm0
            type: float32
            units: m
            description: "Significant wave height"
          - name: Hm0_status
            type: uint8
            description: "Status code (0-9)"
          # 10-11 — confirmed
          - name: Hmax
            type: float32
            units: m
            description: "Maximum wave height"
          - name: Hmax_status
            type: uint8
            description: "Status code (0-9)"
          # 12-13 — confirmed
          - name: HTmax
            type: float32
            units: m
            description: "Wave height of maximum wave period"
          - name: HTmax_status
            type: uint8
            description: "Status code (0-9)"
          # 14-15 — confirmed
          - name: Tp1
            type: float32
            units: s
            description: "Primary wave peak period"
          - name: Tp1_status
            type: uint8
            description: "Status code (0-9)"
          # 16-17 — confirmed
          - name: Tp2
            type: float32
            units: s
            description: "Secondary wave peak period"
          - name: Tp2_status
            type: uint8
            description: "Status code (0-9)"
          # 18-19 — confirmed
          - name: Tpc
            type: float32
            units: s
            description: "Calculated wave peak period"
          - name: Tpc_status
            type: uint8
            description: "Status code (0-9)"
          # 20-21 — confirmed
          - name: Ts
            type: float32
            units: s
            description: "Significant wave period"
          - name: Ts_status
            type: uint8
            description: "Status code (0-9)"
          # 22-23 — confirmed
          - name: Tm0_1
            type: float32
            units: s
            description: "Energy wave period (Te)"
          - name: Tm0_1_status
            type: uint8
            description: "Status code (0-9)"
          # 24-25 — confirmed
          - name: Tm0_2
            type: float32
            units: s
            description: "Integral wave period"
          - name: Tm0_2_status
            type: uint8
            description: "Status code (0-9)"
          # 26-27 — confirmed
          - name: Tm02
            type: float32
            units: s
            description: "Mean zero up-crossing period"
          - name: Tm02_status
            type: uint8
            description: "Status code (0-9)"
          # 28-29 — confirmed
          - name: Tm01
            type: float32
            units: s
            description: "Mean period"
          - name: Tm01_status
            type: uint8
            description: "Status code (0-9)"
          # 30-31 — confirmed
          - name: Tmax
            type: float32
            units: s
            description: "Maximum wave period"
          - name: Tmax_status
            type: uint8
            description: "Status code (0-9)"
          # 32-33 — confirmed
          - name: THmax
            type: float32
            units: s
            description: "Wave period of maximum wave height"
          - name: THmax_status
            type: uint8
            description: "Status code (0-9)"
          # 34-35 — inferred (?)
          - name: steepness
            type: float32
            description: "(?) Wave steepness"
          - name: steepness_status
            type: uint8
            description: "Status code (0-9)"
          # 36-37 — inferred (?)
          - name: Dp1_t
            type: float32
            units: degrees
            description: "(?) Primary wave peak direction, true north"
          - name: Dp1_t_status
            type: uint8
            description: "Status code (0-9)"
          # 38-39 — inferred (?)
          - name: Dm_t
            type: float32
            units: degrees
            description: "(?) Total energy mean direction, true north"
          - name: Dm_t_status
            type: uint8
            description: "Status code (0-9)"
          # 40-41 — inferred (?)
          - name: spread1
            type: float32
            units: degrees
            description: "(?) Primary directional spreading"
          - name: spread1_status
            type: uint8
            description: "Status code (0-9)"
          # 42-43 — inferred (?)
          - name: Dp2_t
            type: float32
            units: degrees
            description: "(?) Secondary wave peak direction, true north"
          - name: Dp2_t_status
            type: uint8
            description: "Status code (0-9)"
          # 44-45 — inferred (?)
          - name: Dm2_t
            type: float32
            units: degrees
            description: "(?) Secondary mean direction, true north"
          - name: Dm2_t_status
            type: uint8
            description: "Status code (0-9)"
          # 46-47 — inferred (?)
          - name: spread2
            type: float32
            units: degrees
            description: "(?) Secondary directional spreading"
          - name: spread2_status
            type: uint8
            description: "Status code (0-9)"
          # 48-49 — inferred (?)
          - name: epsilon
            type: float32
            description: "(?) Spectral narrowness parameter"
          - name: epsilon_status
            type: uint8
            description: "Status code (0-9)"
          # 50-51 — inferred (?)
          - name: nu
            type: float32
            description: "(?) Spectral bandwidth parameter"
          - name: nu_status
            type: uint8
            description: "Status code (0-9)"
          # 52-53 — inferred (?)
          - name: kappa
            type: float32
            description: "(?) Spectral peakedness parameter"
          - name: kappa_status
            type: uint8
            description: "Status code (0-9)"
          # 54-55 — inferred (?)
          - name: m0
            type: float64
            units: m²
            description: "(?) Zeroth spectral moment"
          - name: m0_status
            type: uint8
            description: "Status code (0-9)"
          # 56-57 — inferred (?)
          - name: m1
            type: float64
            units: m²·s
            description: "(?) First spectral moment"
          - name: m1_status
            type: uint8
            description: "Status code (0-9)"
          # 58-59 — inferred (?)
          - name: m2
            type: float64
            units: m²·s²
            description: "(?) Second spectral moment"
          - name: m2_status
            type: uint8
            description: "Status code (0-9)"
          # 60-61 — inferred (?)
          - name: m3
            type: float64
            units: m²·s³
            description: "(?) Third spectral moment"
          - name: m3_status
            type: uint8
            description: "Status code (0-9)"
          # 62-63 — inferred (?)
          - name: m4
            type: float64
            units: m²·s⁴
            description: "(?) Fourth spectral moment"
          - name: m4_status
            type: uint8
            description: "Status code (0-9)"
          # 64-65 — unknown, sample value 3.70

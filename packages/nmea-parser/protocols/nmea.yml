      # ---------------------------------------------------------------
      # PMIRLD – Wave Spectrum (VARIABLE LENGTH)
      # Miros SM-050 Wave and Current Radar
      #
      # Header: 10 fixed fields
      # Data: num_frequencies * (1 + num_directions) float values
      # Trailer: status, avg_heading, 5 reserved fields
      #
      # Typical configs seen:
      #   64 freqs × (1 + 36 dirs) = 2368 data values
      #   31 freqs × (1 + 36 dirs) = 1147 data values
      # Parser must read header to determine data count.
      # ---------------------------------------------------------------
      - id: PMIRLD
        description: "Miros wave spectrum (directional + point spectrum) — variable length"
        payload:
          # 1
          - name: timestamp
            type: string
            description: "UTC timestamp hhmmss or hhmmss.sss"
          # 2
          - name: day
            type: uint8
            description: "Day of month, 01-31"
          # 3
          - name: month
            type: uint8
            description: "Month, 01-12"
          # 4
          - name: year
            type: uint16
            description: "Year"
          # 5
          - name: sequence_number
            type: string
            description: "Sequence number (max 8 chars)"
          # 6
          - name: num_frequencies
            type: uint8
            description: "Number of frequency bins"
          # 7
          - name: start_frequency
            type: float64
            units: Hz
            description: "Start frequency"
          # 8
          - name: frequency_resolution
            type: float64
            units: Hz
            description: "Frequency resolution"
          # 9
          - name: num_directions
            type: uint8
            description: "Number of direction bins"
          # 10 — variable length spectrum data
          # Total values = num_frequencies * (1 + num_directions)
          # Layout:
          #   [0 .. n-1]           = Point spectrum (n values, m²/Hz)
          #   [n .. 2n-1]          = Directional spectrum, direction 1
          #   ...
          #   [(D)*n .. (D+1)*n-1] = Directional spectrum, direction D
          - name: spectrum_data
            type: float64
            description: "Variable-length array: num_frequencies * (1 + num_directions) floats.
              Parser must read num_frequencies and num_directions from header.
              First block = point spectrum, then one block per direction."
          # trailer
          - name: spectrum_status
            type: uint8
            description: "Status code for the spectrum (0-9)"
          - name: average_vessel_heading
            type: float64
            units: degrees
            description: "Average vessel heading during measurement"
          - name: reserved_1
            type: string
            description: "Reserved (empty)"
          - name: reserved_2
            type: string
            description: "Reserved (empty)"
          - name: reserved_3
            type: string
            description: "Reserved (empty)"
          - name: reserved_4
            type: string
            description: "Reserved (empty)"
          - name: reserved_5
            type: string
            description: "Reserved (empty, last field before checksum)"
  # =================================================================
  # NMEA 0183 — Proprietary sentences: Kongsberg Seatex (PSXN)
  # =================================================================
  #
  # Source: MGC(R) COMPASS Installation Manual, MGC-D-114/408705/15/O,
  #         Rev. 15 (October 2024), pages 108-109. PSXN20 + PSXN23 were
  #         introduced in Rev. 14 (March 2024).
  #
  # `SXN` is the NMEA 0183 manufacturer mnemonic for Seatex (Kongsberg
  # Seatex) — the datasheet calls PSXN the "Seatex ID".
  #
  # ⚠️ ON THE WIRE THESE ARE BOTH `$PSXN,...` — the id is the SAME and both
  # carry the SAME number of fields (5), so they cannot be told apart by
  # `id + payload length`. The first field is the message number (20 | 23),
  # and a SENTENCE RESOLVER (src/resolvers.ts, keyed `PSXN:5`) rewrites the
  # id to PSXN20 / PSXN23 before this knowledge base is consulted. `raw`
  # keeps the original `$PSXN,...` and the checksum still verifies against it.
  # =================================================================
  - protocol: KONGSBERG SEATEX
    version: '15'
    standard: false
    sentences:
      # ---------------------------------------------------------------
      # PSXN20 — quality indicators for roll, pitch, heading and position
      # $PSXN,20,x,x,x,x*hh<CR><LF>
      # ---------------------------------------------------------------
      - id: PSXN20
        description: "The proprietary PSXN20 NMEA sentence contains quality indicators for roll, pitch, heading and position. The sentence destination is positioning reference systems. The sentence is based on NMEA sentence format."
        payload:
          # 1
          - name: message_number
            type: uint8
            description: "Message number: 20"
          # 2
          - name: horizontal_quality
            type: uint8
            description: "Horizontal position and velocity quality\n0 = Normal\n1 = Reduced performance\n2 = Invalid data"
          # 3
          - name: height_quality
            type: uint8
            description: "Height and vertical velocity quality\n0 = Normal\n1 = Reduced performance\n2 = Invalid data"
          # 4
          - name: heading_quality
            type: uint8
            description: "Heading quality\n0 = Normal\n1 = Reduced performance\n2 = Invalid data"
          # 5
          - name: roll_pitch_quality
            type: uint8
            description: "Roll and pitch quality\n0 = Normal\n1 = Reduced performance\n2 = Invalid data"
      # ---------------------------------------------------------------
      # PSXN23 — attitude and heave calculated in the MGC system
      # $PSXN,23,x.x,x.x,x.x,x.x*hh<CR><LF>
      # ---------------------------------------------------------------
      - id: PSXN23
        description: "The proprietary PSXN23 NMEA sentence contains attitude and heave data calculated in the MGC system. The sentence destination is PRS monitoring systems. The sentence is based on NMEA sentence format."
        payload:
          # 1
          - name: message_number
            type: uint8
            description: "Message number: 23"
          # 2
          - name: roll
            type: float64
            units: deg
            description: "Roll in degrees. Positive with port side up."
          # 3
          - name: pitch
            type: float64
            units: deg
            description: "Pitch in degrees. Positive with bow up."
          # 4
          - name: heading
            type: float64
            units: deg
            description: "Heading, degrees true."
          # 5
          - name: heave
            type: float64
            units: m
            description: "Heave. Positive down."

  # =================================================================
  # NMEA 0183 — Proprietary sentences: TRIMBLE ($PTNL)
  # -----------------------------------------------------------------
  # Trimble-defined formats that OTHER receivers emit for compatibility —
  # Septentrio lists both in Appendix C of the AsteRx SB3 Pro+ 4.10.1 reference
  # guide. Both arrive as `$PTNL,<TYPE>,...` with the type in the FIRST FIELD and
  # the same field count, exactly like Kongsberg's $PSXN, so they are resolved by
  # `PTNL:12` in src/resolvers.ts before the knowledge base is consulted.
  #
  # `version: '1'` is OUR knowledge-base revision, not a Trimble one: Trimble
  # publishes no protocol version for these sentences, and CMA requires a version
  # string. Source: Trimble Alloy GNSS receiver NMEA-0183 documentation
  # (receiverhelp.trimble.com), cross-checked against help.fieldsystems.trimble.com.
  # =================================================================
  - protocol: TRIMBLE
    version: '1'
    standard: false
    sentences:
      - id: PTNLAVR
        description: "Trimble proprietary $PTNL,AVR — yaw, tilt and the antenna baseline, computed from the moving-baseline vector. Requires a two-antenna system."
        payload:
          # 1
          - name: message_id
            type: string
            description: "Message type: AVR"
          # 2
          - name: utc_time
            type: string
            description: "UTC of the vector fix (hhmmss.ss)"
          # 3
          - name: yaw
            type: float64
            units: deg
          # 4
          - name: yaw_indicator
            type: string
            description: "Constant text: Yaw"
          # 5
          - name: tilt
            type: float64
            units: deg
          # 6
          - name: tilt_indicator
            type: string
            description: "Constant text: Tilt"
          # 7
          - name: reserved_1
            type: string
            description: "NOT DOCUMENTED by Trimble. Both of Trimble's own field tables skip fields 7 and 8, and both are empty in Trimble's own example sentence. Left as an unnamed passthrough rather than guessed at — the raw value is still here if a device turns out to fill it."
          # 8
          - name: reserved_2
            type: string
            description: "NOT DOCUMENTED by Trimble — see reserved_1."
          # 9
          - name: range
            type: float64
            units: m
            description: "Distance between the two antennas"
          # 10
          - name: gps_quality
            type: int8
            description: "0 = Invalid\n
              1 = Autonomous\n
              2 = RTK Float\n
              3 = RTK Fixed\n
              4 = DGPS"
          # 11
          - name: pdop
            type: float64
          # 12
          - name: satellites
            type: uint8
            description: "Number of satellites used in the solution"
      - id: PTNLGGK
        description: "Trimble proprietary $PTNL,GGK — position fix with an ELLIPSOIDAL height, unlike GGA's mean-sea-level altitude. Longer than the NMEA 0183 80-character limit."
        payload:
          # 1
          - name: message_id
            type: string
            description: "Message type: GGK"
          # 2
          - name: utc_time
            type: string
            description: "UTC of the position fix (hhmmss.ss)"
          # 3
          - name: utc_date
            type: string
            description: "Date as mmddyy — MONTH FIRST, unlike RMC's ddmmyy. Kept as a string for that reason."
          # 4
          - name: latitude
            type: string
            units: deg
            description: "Degrees and decimal minutes (ddmm.mmmmmmm)"
          # 5
          - name: latitude_direction
            type: string
            description: "N: North\n
              S: South"
          # 6
          - name: longitude
            type: string
            units: deg
            description: "Degrees and decimal minutes (dddmm.mmmmmmm)"
          # 7
          - name: longitude_direction
            type: string
            description: "E: East\n
              W: West"
          # 8
          - name: gps_quality
            type: int8
            description: "0 = Invalid\n
              1 = Autonomous\n
              2 = RTK Float\n
              3 = RTK Fixed\n
              4 = DGPS\n
              5 = SBAS\n
              6 = RTK 3D Float\n
              7 = RTK 3D Fixed\n
              8 = RTK 2D Float\n
              9 = RTK 2D Fixed\n
              10 = OmniSTAR HP/XP\n
              11 = OmniSTAR VBS\n
              12 = Location RTK\n
              13 = Beacon DGPS\n
              14 = CenterPoint RTX\n
              15 = xFill"
          # 9
          - name: satellites
            type: uint8
            description: "Number of satellites used in the solution"
          # 10
          - name: dop
            type: float64
            description: "Dilution of precision of the fix"
          # 11
          - name: ellipsoidal_height
            type: string
            units: m
            description: "Ellipsoidal height — antenna height above the ellipsoid, NOT above mean sea level. A STRING because the value carries an EHT prefix on the wire (e.g. EHT150.790), so it does not parse as a number."
          # 12
          - name: height_units
            type: string
            description: "M = meters"

  # =================================================================
  # NMEA 0183 — Proprietary sentences: LEICA
  # -----------------------------------------------------------------
  # Leica-defined format, emitted by other receivers for compatibility (Septentrio
  # Appendix C lists LLQ, GGQ and LLK). Only LLQ is defined here: a verified field
  # table with a vendor example was available for it, and inventing the other two
  # from prose would be worse than leaving them generic.
  #
  # Arrives as `$GPLLQ,...` — a normal talker + formatter, so no resolver is needed.
  # `version: '1'` is OUR knowledge-base revision; Leica publishes no protocol
  # version for it, and CMA requires a version string. Field table transcribed from
  # Trimble's NMEA-0183 LLQ documentation (receiverhelp.trimble.com), which
  # documents the Leica format, example `$GPLLQ,034137.00,210712,,M,,M,3,15,0.011,,M*15`.
  # =================================================================
  - protocol: LEICA
    version: '1'
    standard: false
    sentences:
      - id: LLQ
        description: "Leica local position and quality — position as GRID coordinates (easting/northing in metres in a local projection), not latitude/longitude."
        payload:
          # 1
          - name: utc_time
            type: string
            description: "UTC of the position (hhmmss.ss)"
          # 2

<script type="text/javascript">
  RED.nodes.registerType("cma-norsub-parser", {
    // Category
    category: "CoreMarine",
    // UI
    color: "#ccc4b0",
    icon: "cma-logo-blue.png",
    label: function () {
      const { name } = this;
      return name || "NorSub";
    },
    paletteLabel: "NorSub parser",
    labelStyle: function () { return this.name ? "node_label_italic" : "" },
    align: "left",
    // Input - Outputs
    inputs: 1,
    outputs: 1,
    inputLabels: "NorSub data",
    outputLabels: "Parsed CMA data",
    // Logic
    defaults: {
      name: { value: "" },
      // The protocol the eMRU is configured to emit. Only NMEA is implemented today;
      // the device also supports TSS1, Atlas, Ifremer Victor, Simrad EM 3000 and a
      // custom binary format, and each will add an <option> here.
      protocol: {
        value: "nmea",
        required: true,
      },
      memory: {
        value: true,
        required: true,
      },
      file: {
        value: "",
        required: false
      }
    },
  });
</script>

<!-- Help text -->
<script type="text/markdown" data-help-name="cma-norsub-parser">
Parser for NorSub eMRU telegrams — the NorSub proprietary sentences **and** all of NMEA 0183 —
emitting the unified **CMA** format. Wrapper of
[@coremarine/norsub-emru](https://www.npmjs.com/package/@coremarine/norsub-emru).

### Input

: payload (string) : NorSub / NMEA ASCII content (important, it is an *ASCII* string, not another encoding).

: *memory* (object) : Check or enable / disable the parser's memory (details below).

: *protocol* (object) : Get or set which protocol the device is emitting (details below).

: *sentences* (object) : Get the known sentence definitions, or add your own (details below).

: *sentence* (string) : Sentence ID, to check whether it is supported and read its definition.

: *fake* (string) : Sentence ID, to get a valid sample sentence for testing.

### Output

: payload (array) : An array of **CMA** objects, one per parsed sentence.

: *memory* (object) : Response to the *memory* input.

: *protocol* (object) : Response to the *protocol* input.

: *sentences* (object) : Response to the *sentences* input.

: *sentence* (object | null) : Response to the *sentence* input.

: *fake* (string | null) : Response to the *fake* input.

Any input key you do not send is absent from the output too. On a bad request the
corresponding output key holds an error **string** instead of a result.

### Details

Every time the node receives `payload` data it emits the sentences parsed from it. Incomplete
input is buffered until the rest arrives, so a sentence split across two messages still parses.

#### Device status

The `PNORSUB*` sentences carry a 32-bit health/status bitfield, decoded for you:

- `payload[i].payload[last].metadata.status` — for the five sentences whose status is a single
  `uint32` field (`PNORSUB`, `PNORSUB2`, `PNORSUB6`, `PNORSUB7`, `PNORSUB8`).
- `payload[i].metadata.payload.status` — for **all six**, including `PNORSUB7b`, whose status is
  split across two `uint16` fields that mean nothing individually.

Read it from `metadata.payload.status` and the same path works for every variant, so swapping a
PNORSUB7b unit for a PNORSUB8 one costs you no flow changes.

`PTVG` fields are strings on the wire (the unit letter is glued to the value); the decoded
degrees are in each field's `metadata.degrees`.

#### Memory

Enabled by default:

- memory enabled: each injection is appended to whatever is still buffered.
- memory disabled: each injection replaces the buffer.

|                          Input                           |                            Output                             |
| :------------------------------------------------------: | :-----------------------------------------------------------: |
| `memory`: { `command`: `"set"`, `payload`: **boolean** } | `memory`: { `memory`: **boolean**, `characters`: **number** } |
|             `memory`: { `command`: `"get"` }             | `memory`: { `memory`: **boolean**, `characters`: **number** } |

#### Protocol

An eMRU is configured to emit **one** protocol, so this selects it rather than combining several.
`nmea` is the only value implemented today; the device also supports TSS1, Atlas, Ifremer Victor,
Simrad EM 3000 and a custom binary format.

⚠️ **Setting it discards internal state** — the buffer and any parsed-but-unsent sentences are
dropped, because half a sentence in one protocol can never be completed by another. An unknown
value is refused with an error string and the current protocol is kept.

|                          Input                          |                             Output                              |
| :-----------------------------------------------------: | :-------------------------------------------------------------: |
| `protocol`: { `command`: `"set"`, `payload`: **string** } | `protocol`: { `protocol`: **string**, `protocols`: **string[]** } |
|            `protocol`: { `command`: `"get"` }            | `protocol`: { `protocol`: **string**, `protocols`: **string[]** } |

#### Sentences

The NorSub and NMEA 0183 definitions are **built in** — you do not need to load anything. This is
for adding your *own* sentences on top. Send `command: "set"` with **one** of:

1. `content`: the YAML **string** of the definitions.
2. `file`: a **string** path to a YAML file (read by the node).

`content` takes precedence if both are sent. On bad YAML, a schema mismatch or an unreadable file
the output is an error **string**. Use `get` to list what is currently known.

|                           Input                            |         Output          |
| :--------------------------------------------------------: | :---------------------: |
| `sentences`: { `command`: `"set"`, `content`: **string** } | `sentences`: **object** |
|  `sentences`: { `command`: `"set"`, `file`: **string** }   | `sentences`: **object** |
|            `sentences`: { `command`: `"get"` }             | `sentences`: **object** |

> Note: this key was called `protocols` before v2. It was renamed because the parser now also has
> a *protocol* selection (above), and two keys one letter apart meaning unrelated things was a trap.

#### Sentence

Send a sentence id to check whether it is supported. The response is its definition, or `null`.

|         Input          |              Output              |
| :--------------------: | :------------------------------: |
| `sentence`: **string** | `sentence`: **object** \| `null` |

#### Fake

Send a sentence id to get a syntactically valid sample sentence, useful for testing. The checksum
and structure are correct; the field values are garbage. `null` if the id is unknown.

|       Input        |            Output            |
| :----------------: | :--------------------------: |
| `fake`: **string** | `fake`: **string** \| `null` |

</script>
